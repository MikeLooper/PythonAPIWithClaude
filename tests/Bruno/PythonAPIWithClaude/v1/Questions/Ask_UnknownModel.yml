info:
  name: Ask_UnknownModel
  type: http
  seq: 3

http:
  method: POST
  url: "{{Host}}api/v{{version}}/{{controller}}"
  body:
    type: json
    data: |-
      {
        "question": "What is the capital of France?",
        "model": "claude-does-not-exist"
      }
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("should return status 400", function () {
          expect(res.getStatus()).to.equal(400);
        });

        test("should explain that Claude rejected the request", function () {
          const resBody = res.getBody();

          expect(resBody).to.have.property("detail");
          expect(resBody.detail).to.contain("Claude rejected the request");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
